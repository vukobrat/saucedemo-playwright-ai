name: Review eval

# Regression eval for the AI review: the locator-reviewer's own prompt and command line on small
# pull requests with planted violations and on clean controls (evals/review/config.json). Fails when
# the gate fails. It runs when anything the review depends on changes: its instructions, the rules,
# the command line, the page objects it reads or the eval. Same command locally: npm run eval:review.
on:
  pull_request:
    paths:
      - .claude/agents/locator-reviewer.md
      - .claude/rules/pages.md
      - scripts/lib/claude-headless.mjs
      - scripts/lib/review-run.mjs
      - scripts/schemas/locator-review.schema.json
      - scripts/eval/checkout.mjs
      - scripts/eval/pool.mjs
      - scripts/eval/run-review-eval.mjs
      - evals/review/**
      - src/pages/**
      - src/components/**
      - docs/app-exploration.md
      - .github/workflows/review-eval.yml
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per case (more runs measure consistency, at a higher cost)
        default: '3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.308

jobs:
  eval:
    name: Review eval
    # Fork pull requests get no secrets, so they are skipped rather than failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # Three runs per case by default: a review costs under a cent on Haiku, and its severities
      # vary between runs.
      - name: Eval
        run: npm run eval:review -- --repeat "$REPEAT"
        env:
          REPEAT: ${{ inputs.repeat || '3' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Job summary
        if: ${{ always() && hashFiles('eval-output/review-latest.md') != '' }}
        run: cat eval-output/review-latest.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: review-eval
          path: eval-output/
          if-no-files-found: ignore
          retention-days: 30
