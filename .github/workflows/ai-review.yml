name: AI review

# Adding the `ai-review` label to a pull request runs the locator-reviewer agent on the page
# objects and components it changes, and posts the result as one comment (edited on re-runs). The
# agent reads files only and never gets a GitHub token; this workflow posts the comment.
# Same command locally: npm run agent:review -- <pr-number>.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write # the comment, posted by the last step, not by the agent

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.308

jobs:
  review:
    name: Locator review
    # A label means a maintainer chose to spend on this review. Fork pull requests get no secrets.
    if: >-
      github.event.label.name == 'ai-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Review
        run: npm run agent:review -- "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }} # lists the changed files; removed before the agent starts

      - name: Post the review
        run: gh pr comment "$PR_NUMBER" --body-file agent-output/review.md --edit-last --create-if-none
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: locator-review
          path: agent-output/
          if-no-files-found: ignore
          retention-days: 30
